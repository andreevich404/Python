{% extends "core/base.html" %}
{% block title %}Новости погоды{% endblock %}
{% block content %}
<section class="bg-white border rounded p-4">
    <h1 class="h3 mb-3">Новости погоды</h1>
    {% if error %}
    <div class="alert alert-warning mb-0" role="alert">{{ error }}</div>
    {% else %}
    <div class="list-group">
        {% for item in news.items %}
        <a class="list-group-item list-group-item-action" href="{{ item.url }}">
            {{ item.title }}
        </a>
        {% empty %}
        <p class="text-muted mb-0">Новости погоды не найдены.</p>
        {% endfor %}
    </div>
    {% endif %}
</section>
{% endblock %}
