{% extends "core/base.html" %}
{% block title %}Детали погоды{% endblock %}
{% block content %}
<section class="bg-white border rounded p-4">
    <h1 class="h3 mb-3">Детали погоды: {{ city }}</h1>
    {% if error %}
    <div class="alert alert-warning mb-0" role="alert">{{ error }}</div>
    {% else %}
    <dl class="row mb-0">
        <dt class="col-sm-3">Температура</dt>
        <dd class="col-sm-9">{{ details.temperature }}</dd>
        <dt class="col-sm-3">Ветер</dt>
        <dd class="col-sm-9">{{ details.wind }}</dd>
        <dt class="col-sm-3">Давление</dt>
        <dd class="col-sm-9">{{ details.pressure }}</dd>
    </dl>
    {% endif %}
</section>
{% endblock %}
